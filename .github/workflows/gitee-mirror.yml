name: Mirror to Gitee

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 15 * * *'  # 每天 UTC 15:23（北京 23:23）兜底同步一次
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Push mirror to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}   # 形如 zl2237/system-cleanup
        run: |
          git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          git push --mirror "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
